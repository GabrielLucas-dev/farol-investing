# Ambiente de desenvolvimento: só o banco roda em container.
# API e web rodam na máquina (npm run start:dev / npm start) para ter hot reload rápido.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5433
    volumes:
      - farol-db-data:/var/lib/postgresql/data    # farol-db-data -> nome que eu escolho
                                                  # Restante -> local onde o Postgres guarda os arquivos do banco 
    
volumes:
  farol-db-data:
       

